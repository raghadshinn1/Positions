<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online FoodShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Online</h1>
        <p class="subtitle">FoodShop</p>
    </header>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">ContactUs</a></li>
        </ul>
    </nav>

    <section class="hero-section">
        <div class="hero-content">
            <h2>Welcome to Online FoodShop</h2>
            <button class="order-btn">ORDER NOW</button>
        </div>

        <div class="floating-box prices-box">
            <span class="box-label">Prices</span>
        </div>
        <div class="floating-box specials-box">
            <span class="box-label">Specials</span>
        </div>
    </section>

    <div class="featured-divider">
        <span>Featured Products</span>
    </div>

    <section class="products-section">
        <div class="product-card">
            <div class="image-wrapper">
                <img src="images/img3.jpg" alt="Cupcakes">
                <button class="card-order-btn">ORDER NOW</button>
            </div>
        </div>

        <div class="product-card">
            <div class="image-wrapper">
                <img src="images/img4.jpg" alt="Drinks">
                <button class="card-order-btn">ORDER NOW</button>
            </div>
        </div>

        <div class="product-card">
            <div class="image-wrapper">
                <img src="images/img5.jpg" alt="Dish">
                <button class="card-order-btn">ORDER NOW</button>
            </div>
        </div>
    </section>

    <footer>
        <p>Copyright &copy; 2020-2021 OnlineFoodShop. All Rights are reserved.</p>
    </footer>

</body>
</html>
