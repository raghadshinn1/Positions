    <title>Position relative & static</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <div class="box relative-box" style="background-color: #e65c8a;">1</div>
        <div class="box static-box" style="background-color: #00ffff;">2</div>
        <div class="box static-box" style="background-color: #ffff00;">3</div>
        <div class="box static-box" style="background-color: #adff2f;">4</div>

        <div class="box static-box" style="background-color: #ff00ff;">5</div>
        <div class="box static-box" style="background-color:#800080;">6</div>
        <div class="box static-box" style="background-color: #e65c8a;">7</div>
        <div class="box static-box" style="background-color: #00ffff;" >8</div>

        <div class="box static-box"style="background-color: #adff2f;">9</div>
        <div class="box static-box" style="background-color: #ffff00;">10</div>
        <div class="box static-box" style="background-color: #ff00ff;">11</div>
        <div class="box static-box"style="background-color:#800080;">12</div>

    </div>

</body>
</html>
